  load_vae_feat: false

model:
  model: SanaRWMVideoQwenNextSubAttnResV2SelfFlowWorldModelCameraConditionMultiViewCausal_5B_P1_D36
  extra:
    action_dim: 80
    state_dim: 80
    rope: aligned
    chunk_causal_policy:
      actions_per_chunk: {"25": 32}
      sliding_window_chunks: 1
      memory_content: video_only
      causal_observation: true
      causal_state: true
      gdn_fused_two_stream: true
      # no AttnRes module (use_attn_res false): nothing for these two to act on
      attn_res_fast_attend: false
      attn_res_compiled_sum: false
      # 2026-10-24 (user: "好的，那我们就换FA2的varlen吧"): the softmax layers' two-stream attention as packed FlashAttention-2
      # varlen groups instead of FlexAttention (audit causal_softmax_varlen_switch_20261025T030044Z)
      softmax_varlen_attention: true
      # 2026-10-25 (user: "好的，现在切换N1"): the GDN decay matmul and the fused GDN prologue / epilogue
      # (rwm/zekai-merge bf824fbf0 / 35b423b3b; audits causal_gdn_decay_matmul_20261025T071042Z,
      # causal_gdn_fused_io_20261025T081501Z)
      gdn_decay_matmul: true
      gdn_fused_qk_rope: true
      gdn_fused_output: true
      # 2026-10-25 (user: "好的，现在切换N1"): adaLN modulation rows per distinct timestep and the cross-attention caption
      # K/V once per row with fused q / k RMSNorm (rwm/zekai-merge db2149f09; audits causal_rowmod_xattn_switch_20261025T190211Z,
      # causal_sana_latent_n1_rowmod_xattn_switch_20261025T194528Z)
      row_modulation: true
      row_modulation_fused_norm: true
      row_modulation_bf16_input: true
      cross_attn_kv_dedup: true
      cross_attn_fused_qk_norm: true
  image_size: 320
  mixed_precision: bf16
  fp32_attention: false
  load_from: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/sana_wam_runs/warmstart_ckpt_vault/sana_rwm_pretrained_vanilla_mixv4_capv3_twostream_obsblock_e5s50000
  multi_scale: true
  softmax_ratio: 0.25
  linear_attn_type: GatedDeltaNet
  softmax_attn_type: GatedSoftmaxAttention
  memory_gdn_output_normalizer: false
  linear_head_dim: 128
  softmax_head_dim: 256
  ffn_type: SwiGLU
  mlp_ratio: 4.0
  use_pe: true
  pos_embed_type: wan_rope
  qk_norm: true
  cross_norm: true
  class_dropout_prob: 0.1
  # plain residual stack (53234167c); the donor's AttnRes queries are dropped on load
  use_attn_res: false
  remove_state_dict_keys:
    - attn_res.attn_proj.weight
    - attn_res.mlp_proj.weight
    - attn_res.final_proj.weight
  use_time_conditioning: false
  attn_res_block_size: 8


      normalization_sha256: 1fe3b7e72e8fa93eca5efb8a8deeace1daf4434b4b97e9f4445670ac758287ed
      vae_latent_cache_dir: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/sana_wam_data_cache/sft_vae_latents_nsc_torch210
      allow_online_encode: false

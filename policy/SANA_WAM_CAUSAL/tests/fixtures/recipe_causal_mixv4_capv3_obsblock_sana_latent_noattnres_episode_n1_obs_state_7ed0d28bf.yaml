# Sana rwm/zekai-merge 7ed0d28bf dev/rwm/configs/causal/robot_pretrain/causal_robodojo_vanilla_mixv4_capv3_obsblock50000_eefabs_f33fps8_sana_latent_noattnres_episode_n1_obs_state_videoonly_nsc.yaml
# (the sana_latent no-AttnRes N1 recipe on the 0c88c11ab clock: no physical_rope key, the sink at chunk max(0, c - 7)), copied verbatim below this header.
# RoboDojo episode N1 SFT, sana_latent, chunk-causal with causal observation latents and the causal state, WITHOUT
# AttnRes (user 2026-10-31: "现在准备sana latent N1关掉attnres的训练recipe"; obs + state as the sana_pixel N1, on NSC).
# The sana_pixel obs-block N1 recipe (causal_robodojo_vanilla_mixv4_capv3_obsblock50000_..._sana_pixel_..._nsc.yaml, run
# _v2, stopped at 22,500) with:
# - sana_latent: multiview sana_latent, ASPECT_RATIO_VIDEO_320_ROBOT, the three views stretched to 256 x 320 each
#   (AGENTS.md 2026-10-02), the NSC phase store v2-f33-vs4-phase-stretch-ae44f4a5961380ab (240 tokens a latent frame);
#   no sana_pixel_pad;
# - model.use_attn_res: false (rwm/zekai-merge 53234167c): the causal block stack as a plain residual, each block adding
#   its attention delta (self-attention, then cross-attention on h after it) and its MLP delta to h. The donor's three
#   AttnRes queries are dropped on load (model.remove_state_dict_keys). The obs-block donor was trained with AttnRes, so
#   it starts broken without it (the no-obs smoke: step-1 loss 2.61 instead of 0.37; posttrain handoff 04);
#   attn_res_fast_attend / attn_res_compiled_sum have nothing to act on and are off;
# - the critical-phase loss weight kept (user 2026-10-31: "算了，加上critical phase的loss weight吧", over the earlier
#   "这次我们关掉critical phase的loss weight吧"): gripper_transition_weighting true, each chunk's loss weighted by VPP2's
#   critical-phase density, as the pixel N1;
# - everything else as the pixel recipe: the obs-block donor epoch_5_step_50000 (user: "用zekaili/SANA_Vanilla_Pretrain_
#   256px_abs_mix_v4_capv3_twostream_obsblock_from_ts3500_s15000_ws256这个donor"; its HF repo at 396a8cff, raw weights
#   pinned in the warm-start vault, sha256 80491e2f...), the other ten training speed switches on, numerator-only GDN, the obs-block GDN of the
#   observation group (fd5261ff6), the pretrain's RoPE clock and softmax sink horizon (0c88c11ab), action flow shift 3 /
#   OpenWAM min_weight 0, AdamW betas (0.9, 0.95), warmup 1,000 then cosine to 1e-6 at 50,000 steps, batch tiers
#   b = floor(160 / L) on 32 ranks (8 nodes).
# Data: the CW RoboDojo release with organize_table's official instruction of 2026-10-18, the CW JSON cache,
# normalization 1fe3b7e7.
task: ltx
report_to: wandb
tracker_project_name: sana-rwm
name: causal_robodojo_sana_latent_mixv4_capv3_obsblock50000_noattnres_f33fps8_episode_n1_obs_state_nsc
work_dir: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/sana_wam_runs/output/causal_robodojo_vanilla_mixv4_capv3_obsblock50000_eefabs_f33fps8_sana_latent_noattnres_episode_n1_obs_state_nsc_videoonly

data:
  data_dir:
    RoboDojo-ARX-X5: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/RoboDojo/converted/RoboDojo/arx-x5_zip_nrt_instr20261018
  dataset_repeats:
    RoboDojo-ARX-X5: 1
  image_size: 320
  json_cache_dir: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/sana_wam_data_cache/data_cache_rwm_zekail_absolute_aligned
  caption_proportion:
    detailed_caption: 1
  embodiment_type_only: false
  external_data_filter:
    RoboDojo-ARX-X5:
      _model_fps: {min: 25, max: 25}
  load_text_feat: false
  transform: default_train_video
  type: CausalRoboDojoSFTDataset
  extra:

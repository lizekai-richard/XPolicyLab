# NSC Sana Latent causal pair on whole-episode windows; warm-start from the completed Pantheon33k SFT.
# Every window holds an episode from its first frame, opening with a padded chunk of 1..C frozen first-frame rows (one
# window per chunk-grid phase; wholly frozen for the phase whose next chunk starts at the first frame). The padded
# chunk is memory only, so every trained chunk reads the first observation and at least the padded chunk, and every
# row but the last is the observation of exactly one trained chunk. The first observation is a sink every chunk reads
# besides the N24 softmax window and the GDN scan writes first.
# Latents: the phase-window store v2-f33-vs4-phase-stretch-ae44f4a5961380ab (build_causal_phase_latent_cache.py), one
# member per window: one causal VAE encode of the whole window gives every chunk's targets, each chunk's observation
# frame is encoded alone.
# N24 as in the causal campaign. Schedule (user 2026-10-12): 10k optimizer steps (~10.6 epochs at 941 steps per epoch
# over 16 ranks), 500-step warmup to lr 5e-5, then cosine to 1e-6.

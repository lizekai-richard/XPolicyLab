# The real config.yaml of zekaili/causal_robodojo_sana_latent_mixv4_capv3_obssc19000_physrope_f33fps8_episode_n1_obs_state_nsc at
# Hub revision 67a4ca39e3 (epoch 22 step 10000): physical_rope + causal_observation + causal_state, numerator-only GDN, bf16
# softmax attention. Copied verbatim below this header.
# RoboDojo episode N1 SFT with causal observation latents, the causal state and the physical RoPE clock, from the mix-v4
# caption-v3 observation + causal state pretrain (user 2026-10-22; physical_rope: "是的，我们把它先打开", 6e91eaf2a). Derived from the sana-rwm KEF recipe
# causal_robodojo_vanilla_mixv4_capv3_obsstatecausal19000_eefabs_f33fps8_sana_latent_rowclock_episode_n1_chain_videoonly_kef.yaml
# (job 277572): "按照刚才那个job的config，在我们的repo里新建一份，主要是donor的path", then "请加上causal obs和state"
# with the four chain options dropped (user's choice), so it runs on rwm/zekai-merge as committed:
# - kept: zekail's sana_latent episode N1-obs form (whole-episode two-stream windows, GDN over the episode, softmax
#   window of one clean chunk, video_only memory), causal_observation: true (every noisy chunk's own observation latent,
#   read causally, never written) and causal_state: true (its state row joins the observation group: they read each
#   other, the sink, the window and the GDN state; the targets and actions read both);
# - dropped: observation_order, sink_observation, rope_clock and softmax_sink_horizon, so chunk 0 has its own
#   observation latent, the RoPE is not the chain's row clock and an evicting softmax reader reads the sink next to
#   its window (rwm/zekai-merge defaults).
# - physical_rope: true (6e91eaf2a): every canvas token at its physical instant, a target latent at the middle of
#   its frames (c f_c + i + 0.5625), an observation latent and the state row at the chunk's start, action j at its
#   step, the sink at 0; an evicting softmax reader still reads the sink rotated to its window's start.
# The rest is the KEF recipe's: data (the CW RoboDojo release with organize_table's official instruction of 2026-10-18,
# the CW JSON cache, normalization 1fe3b7e7, the NSC latent store of the same identity), gripper_transition_weighting,
# the batch tiers (8 nodes, user 2026-10-22, per-rank tiers kept: 32 ranks at 4x the 64-rank CW tiers,
# twice its global batch). Donor: epoch_2_step_19000 of SANA_Vanilla_Pretrain_256px_abs_mix_v4_capv3_obs_statecausal_from_dvh31303,
# pinned in the sana_wam_runs warm-start vault (hard links, DONOR.json with its sha256). Name and work dir are this
# repository's, apart from the KEF run's.
# Schedule (user 2026-10-22: "lr是不是1e-4开始，我们warmup 500步，训练30k即可"): peak lr 1e-4, a linear warmup over 500
# steps from 0, cosine to 1e-6 at 30k optimizer steps (the KEF recipe: 1000 / 50k); a fresh schedule, the donor's
# optimizer and scheduler are not loaded.

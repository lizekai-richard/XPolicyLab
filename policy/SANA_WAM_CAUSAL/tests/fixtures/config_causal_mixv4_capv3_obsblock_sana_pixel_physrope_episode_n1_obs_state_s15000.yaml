      holdout_episodes_per_task_split: 0
      holdout_mode: train
      tier_num_frames: 33
      instruction_source: dataset_seen
      normalization_num_frames: 33
      normalization_sha256: 1fe3b7e72e8fa93eca5efb8a8deeace1daf4434b4b97e9f4445670ac758287ed
      vae_latent_cache_dir: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/sana_wam_data_cache/sana_pixel_vae_latents
      allow_online_encode: false
      tail_windows:
        enabled: true
        min_rows: 2
        padding: freeze
      video_fps: 8
    use_mobile_base: false
  num_frames: 1569
  aspect_ratio_type: ASPECT_RATIO_SANA_PIXEL_2X2_320_512
  sort_dataset: false
  shuffle_dataset: false
  resample_fps: false
  multi_fps:

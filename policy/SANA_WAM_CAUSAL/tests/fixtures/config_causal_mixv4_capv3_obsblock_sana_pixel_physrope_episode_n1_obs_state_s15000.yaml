# The real config.yaml of zekaili/causal_robodojo_sana_pixel_mixv4_capv3_obsblock50000_physrope_f33fps8_episode_n1_obs_state at
# Hub revision 01ca5220ad (epoch 37 step 15000, trained on Sana c6d008749 / ff004392a): sana_pixel 320x512, physical_rope +
# causal_observation + causal_state, numerator-only GDN, the GDN branch of the observation group (fd5261ff6). Copied verbatim below this header.
# RoboDojo episode N1 SFT, sana_pixel (320x512 2x2 canvas, unmasked pad), chunk-causal with causal observation latents,
# the causal state and the physical RoPE clock (user 2026-10-28: "帮我再准备一个robodojo的chunk-causal N1 sft的config ...
# 把所有的加速开关全部打开，然后gdn normalizer不要，使用最新的causal obs+state的gdn处理方式"; then "我们这次训练sana pixel
# 模式吧，新donor是zekaili/SANA_Vanilla_Pretrain_256px_abs_mix_v4_capv3_twostream_obsblock_from_ts3500_s15000_ws256").
# Derived from the NSC sana_latent N1 recipe (causal_robodojo_vanilla_mixv4_capv3_obsstatecausal19000_..._sana_latent_
# physrope_episode_n1_obs_state_videoonly_nsc.yaml, campaign 278821 -> 293978), with:
# - sana_pixel: multiview sana_pixel, ASPECT_RATIO_SANA_PIXEL_2X2_320_512, model.extra.sana_pixel_pad: unmasked
#   (AGENTS.md 2026-10-02), the cs-built phase store sana-pixel-rgb-v1-f33-vs4-phase-stretch-6489ad86ac151a33 (the NSC
#   pixel N2 / N4 store; 160 tokens a latent frame);
# - donor: the two-stream obs-block pretrain SANA_Vanilla_Pretrain_256px_abs_mix_v4_capv3_twostream_obsblock_from_ts3500_
#   s15000_ws256, its final epoch_5_step_50000 (raw weights), from the HF repo of that name at 396a8cff, pinned in the
#   warm-start vault with DONOR.json (sha256 80491e2f...); the pretrain itself ran numerator-only GDN with the
#   [o_c; s_c] block;
# - every training speed switch on (the twelve below; precision audit causal_speed_switch_precision_audit_20261026T194521Z);
# - model.memory_gdn_output_normalizer: false (numerator-only GDN read);
# - the GDN of the observation group as sana-rwm's two-stream obs-block (rwm/zekai-merge fd5261ff6, no config key: the
#   launch tree must be at or after it);
# - the N1 recipe's noise settings (user 2026-10-28: "不对，改掉", over the AGENTS.md SFT defaults 1 / 0.1): action flow
#   shift 3 (train and inference), OpenWAM min_weight 0. The first launch with 1 / 0.1 (array 314996) was cancelled at
#   step ~210 before its first checkpoint; this run is _v2 so its W&B id (= name) is a new one;
# - schedule (user 2026-10-28: "warmup 1000，训50k步"): peak lr 1e-4, linear warmup over 1,000 steps, cosine to 1e-6 at
#   50,000 optimizer steps; a fresh schedule, the donor's optimizer and scheduler are not loaded;
# - batch tiers b = floor(160 / L) on 32 ranks (8 nodes; user 2026-10-28), accepted by rwm/zekai-merge since 0284a0414;
# - AdamW beta2 0.95 (user 2026-10-29: "把beta2改成0.95吧", after the loss spike at step ~5060: audit
#   causal_sana_pixel_n1_spike5060_20261029T180559Z) from the first segment after 317320_2; steps before ran beta2 0.999.
#   A resumed segment takes betas / eps from this yaml, not from the checkpoint's optimizer state.
# Data (the CW RoboDojo release with organize_table's official instruction of 2026-10-18, the CW JSON cache,
# normalization 1fe3b7e7) and the rest as the N1 recipe.
task: ltx
report_to: wandb
tracker_project_name: sana-rwm
name: causal_robodojo_sana_pixel_320x512_mixv4_capv3_obsblock50000_physrope_f33fps8_episode_n1_obs_state_nsc_v2
work_dir: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/sana_wam_runs/output/causal_robodojo_vanilla_mixv4_capv3_obsblock50000_eefabs_f33fps8_sana_pixel_physrope_episode_n1_obs_state_nsc_videoonly

data:
  data_dir:
    RoboDojo-ARX-X5: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/RoboDojo/converted/RoboDojo/arx-x5_zip_nrt_instr20261018
  dataset_repeats:
    RoboDojo-ARX-X5: 1
  image_size: 320
  json_cache_dir: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/sana_wam_data_cache/data_cache_rwm_zekail_absolute_aligned

    action_loss_weight: 1.0
    max_save_limit: 3
    keep_milestone_steps: 2500
    rwm_validation_steps: 50
    rwm_validation_seed: 1
    rwm_validation_samples_per_dataset: 10
    rwm_validation_video_samples_per_dataset: 4
    rwm_validation_action_overlay: false
    causal_rwm:
      enabled: true
      min_num_chunks: 0
      max_num_chunks: 48
      # 32 GB300 ranks (8 nodes, user 2026-10-22: "不用降batch size"): 4x the 64-rank tiers of the CW recipe, twice its

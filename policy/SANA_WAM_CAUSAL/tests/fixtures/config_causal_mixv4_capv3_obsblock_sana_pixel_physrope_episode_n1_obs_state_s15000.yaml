      # causal_batch_tiers_m160_1node_20261024T195811Z); the window-length mix is unchanged.
      local_batch_sizes: [[1, 40], [5, 32], [6, 26], [7, 22], [8, 20], [9, 17], [10, 16], [11, 14], [12, 13], [13, 12], [14, 11], [15, 10], [17, 9], [18, 8], [21, 7], [23, 6], [27, 5], [33, 4], [41, 3]]

  min_weight: 0.0
  global_distributed_multiframe: true
  null_embed_root: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/sana_wam_runs/pretrained_embeds
  valid_prompt_embed_root: /scratch/fsw/portfolios/nvr/projects/nvr_elm_llm/users/lezhao/zekail/sana_wam_runs/tmp_embed
  use_fsdp: true
  num_workers: 10
  seed: 1
  train_batch_size: 3
  num_epochs: 100
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 1.0
  optimizer:

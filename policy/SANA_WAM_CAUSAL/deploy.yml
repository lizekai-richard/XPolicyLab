policy_name: SANA_WAM_CAUSAL
protocol: ws
host: localhost
port: null
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
seed: null
action_type: ee
gpu_id: null
eval_batch: false

# One get_action = the executed chunk streamed through the per-view VAE streams and committed (2 forwards with CFG) +
# the chunk's observation encode + sampling_steps x 2 forwards; the first call of an episode encodes the prompt and
# opens the memory instead (the streams at the first frame, the sink and the frozen first chunk committed). The
# RoboDojo client times every RPC out after 120 s whatever this says.
request_timeout_s: 600.0

# --- SANA_WAM_CAUSAL keys (see README "Configuration") ---
# HF-style checkpoint dir of a CAUSAL run of the episode protocol in its single form (Sana 4bd6eca83 on, e.g. the
# pantheon33k sana_latent no-observation run, the pantheon14k sana_pixel N1 / N2 / N4 runs): config.yaml (model.model
# ...MultiViewCausal_5B_P1_D36; model.extra.chunk_causal_policy.memory_content video_and_action | video_only, absent =
# video_and_action; chunk_observation absent or false; data.extra.aligned_phase_window padded (absent) | first_frame) +
# model/pytorch_model_fsdp.bin [+ normalization/*.json] [+ RUN_ID.json / upload_manifest.json, the Hub upload's run
# record, checked against the config]. Refused before any weight: chunk_observation true, in the config or in the run
# record (a run trained with chunk observations: serve it from XPolicyLab d57a617), a run record contradicting the
# config, data.extra.window_repeats (the sink-less pantheon14k m48n24 runs), obs_in_first_chunk (vanilla52k), and the
# sparse / hierarchical memory keys (SANA_WAM_SM). null -> XPolicyLab resolution of ckpt_name.
checkpoint_dir: null
# An SFT (bidirectional) checkpoint has no GDN recurrence parameters; true serves it as the causal policy's step-0 model
# (recurrence initialized as the causal trainer does on its first load). Pipeline checks only, never an evaluation.
allow_donor_checkpoint: false
# null -> <checkpoint_dir>/normalization/<f33 name>, else the packaged copy (refused by the yaml pin of an EEF line)
normalization_path: null
normalization_sha256: null
text_encoder_path: null
vae_path: null
# Sampling: the RoboDojo defaults of every SANA evaluation (10 Euler steps, video CFG 6, action CFG 1; the flow shifts
# from the checkpoint's scheduler.inference_flow_shift / inference_action_flow_shift when null).
sampling_steps: 10
cfg_scale: 6.0
video_cfg_scale: null
action_cfg_scale: 1.0
flow_shift: null
action_flow_shift: null
# Every chunk is denoised as [its observation | its targets] + [state | actions] ([targets] + rows for a model without
# chunk observations) reading the memory: the GDN state of the sink and every committed chunk and, in the softmax
# layers, the sink plus the newest sliding_window_chunks committed chunks, each read rotated on a clock numbered from 0
# at its oldest chunk with the sink one frame before it (training's positions, the StreamingLLM sink; Sana's deploy rank
# clock).
# Memory of the episode: full = the deployment (every executed chunk is committed); none = the memory ABLATION, every
# chunk reopens the memory at its own start frame (a fresh sink and frozen first chunk of that frame) and is generated
# as chunk 1, the first emission of an episode starting there; the executed chunk is still streamed on the memory it was
# generated from for world_model_rel_rmse
memory_mode: full
# What enters memory as the executed chunk's actions (memory_content video_and_action only; a video_only memory keeps
# the target latents alone and refuses any other value): executed = the EE commands actually sent (gripper closedness
# clipped to [0, 1], rot6d through the rotation it encodes) re-normalized; predicted = the raw model output;
# reached = the poses the arms actually REACHED (URDF FK of the joints measured after each action, the observed
# gripper), so the last row equals the next chunk's state slot as in training (dataset state = previous command).
# Every mode logs cmd_vs_reached (per arm: mean/max position gap, max rotation gap, max gripper gap) per chunk.
commit_actions: executed
# Refuse an episode longer than this many decisions (null = no limit; training windows hold whole episodes up to 49
# chunks, longer ones extrapolate the GDN state while the softmax read stays bounded)
max_chunks_per_episode: null
# Per-chunk log of the relative RMSE between the predicted target latent of the executed chunk and its streamed latent
log_world_model_error: true
# Diagnostics: a directory -> one ep{E}_chunk{C}.npz per chunk (C from 1) with how much every generation forward reads
# the memory (softmax attention mass on the sink and per committed chunk / segment, GDN past-vs-window readout); null =
# off
attention_dump_dir: null
# Diagnostics: a directory -> per decision ep{E}_env00_chunk{C}.npz (the generated target latents after the chunk's
# observation latent) and, at the next decision, ep{E}_env00_chunk{C}_observed.npz (its streamed latents); decode with
# tools/decode_prediction_latents.py (real | VAE reconstruction | prediction); the eval worker's @ATTEMPT_DIR@ token puts
# it in the unit attempt; null = off
prediction_latent_dir: null
# null = stretch (the only SFT view resize of the causal line's donors); a contradicting value is refused
view_resize: null
diffusion_seed_base: 20261003
eef_pose_check: true
urdf_path: null
robot_root_poses: null
device: cuda
weight_dtype: bfloat16
strict_image_size: false
default_instruction: follow the instruction

policy_name: SANA_WAM_SM
protocol: ws
host: localhost
port: null
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
seed: null
action_type: ee
gpu_id: null
eval_batch: false

# One get_action = the prefix encode (1 + memory_frames rows of frames in one causal pass: 17 for memory_frames 16, 9 for
# m8s25; three views per row on the sana_latent strip) + one prefix forward per text stream + sampling_steps x (1 or 2)
# forwards of the target chunk (193 tokens on the canvas, 273 on the strip), and from decision 1 on the previous
# decision's world-model reference (one more encode of 1 + 8n + 8 rows);
# the first call of an episode also encodes the prompt. The RoboDojo client times every RPC out after 120 s whatever
# this says.
request_timeout_s: 600.0

# --- SANA_WAM_SM keys (see README "Configuration") ---
# HF-style checkpoint dir of a SPARSE-MEMORY run (Sana rwm/sparse-memory, e.g. the pantheon14k sparse_memory_global
# (fixed-16) / strided_m16s16 / strided_m8s25 recipes, the mix-v3 strided_m8s25 pair on the sana_pixel canvas or the
# sana_latent views): config.yaml (model.model ...MultiViewCausal_5B_P1_D36 with
# model.extra.chunk_causal_policy.memory_type global (fixed before Sana eef7beeab) | strided, memory_frames, and
# memory_stride for strided; sequence_attention full is refused) +
# model/pytorch_model_fsdp.bin [+ normalization/*.json]. null -> XPolicyLab resolution of ckpt_name.
checkpoint_dir: null
# An SFT (bidirectional) checkpoint has no GDN recurrence parameters; true serves it as the policy's step-0 model
# (recurrence initialized as the causal trainer does on its first load). Pipeline checks only, never an evaluation.
allow_donor_checkpoint: false
# null -> <checkpoint_dir>/normalization/<f33 name>, else the packaged copy (refused by the yaml pin of an EEF line)
normalization_path: null
normalization_sha256: null
text_encoder_path: null
vae_path: null
# Sampling: 10 Euler steps, action CFG 1; null takes the checkpoint's own scheduler values: cfg_scale <- inference_cfg_scale
# (6 for the fixed / global-16 run; 1 for the strided m8s25 recipes, trained without condition dropout, whose
# unconditional branch is untrained: CFG > 1 on such a checkpoint warns), flow shifts <- inference_flow_shift /
# inference_action_flow_shift (5 / 1; 5 / 3 for m8s25).
sampling_steps: 10
cfg_scale: null
video_cfg_scale: null
action_cfg_scale: 1.0
flow_shift: null
action_flow_shift: null
# How a decision is evaluated: cached = the prefix [S | M_1..M_n] runs ONCE per text stream into per-layer caches (GDN
# state, softmax K/V), then every denoising step runs the target chunk alone against them (Sana
# SparseMemoryPolicySession.decide; exact up to round-off); uncached = every denoising step runs the TRAINING sequence
# [S | M_1..M_n | T] + rows (Sana decide_uncached, the reference). null = cached.
deploy_form: null
# Refuse an episode longer than this many decisions (null = no limit)
max_chunks_per_episode: null
# Per-decision log of the relative RMSE between the predicted target latent and the target latent of the decision's
# training sample (one more causal encode of the prefix rows + the 8 executed target rows, at the next decision)
log_world_model_error: true
# null = stretch (the only SFT view resize of the line's donors); a contradicting value is refused
view_resize: null
# The prompt's Action Mode sentence (without its trailing period). null = the sentence the shared front-end renders
# from the training yaml's modes ("robot_base_eef; end-effector targets are absolute future poses in the robot base frame,
# and gripper targets are absolute future targets" for the EEF-only absolute line). Sana rwm/sparse-memory db382ee90
# (2026-10-17) changed it for every later run to "robot_base_eef; end-effector targets are absolute future poses expressed
# in the robot base frame" (the sana_latent m8s25 run among them), and no config key tells the two apart: set the
# checkpoint's own sentence (its README). A sentence can also be named (sana_wam_sm.runtime.ACTION_MODE_TEXT_PRESETS), the
# form an eval-worker override needs (the workers split overrides on whitespace): action_mode_text=db382ee90 is the one above.
action_mode_text: null
diffusion_seed_base: 20261012
eef_pose_check: true
urdf_path: null
robot_root_poses: null
device: cuda
weight_dtype: bfloat16
strict_image_size: false
default_instruction: follow the instruction
